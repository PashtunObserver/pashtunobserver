<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#ff4b6e"/>
    </linearGradient>
    <style>
      .lbl { font-family: 'Segoe UI', Verdana, sans-serif; font-size: 17px; fill: #e8e8ff; font-weight: 600; }
      .pct { font-family: 'Consolas', monospace; font-size: 15px; fill: #9fe8ff; }
      .track { fill: #1b1f3b; }
    </style>
  </defs>

  <rect width="900" height="430" rx="18" fill="#0d0b1e"/>

  <!-- Title -->
  <text x="30" y="45" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#ffd60a">⚡ Skill Proficiency</text>

  <!-- C# -->
  <text x="30" y="90" class="lbl">C#</text>
  <rect x="150" y="75" width="680" height="18" rx="9" class="track"/>
  <rect x="150" y="75" width="0" height="18" rx="9" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="595" dur="1.6s" fill="freeze" begin="0.1s"/>
  </rect>
  <text x="845" y="90" text-anchor="end" class="pct">88%</text>

  <!-- JavaScript -->
  <text x="30" y="135" class="lbl">JavaScript</text>
  <rect x="150" y="120" width="680" height="18" rx="9" class="track"/>
  <rect x="150" y="120" width="0" height="18" rx="9" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="632" dur="1.6s" fill="freeze" begin="0.3s"/>
  </rect>
  <text x="845" y="135" text-anchor="end" class="pct">93%</text>

  <!-- PHP -->
  <text x="30" y="180" class="lbl">PHP</text>
  <rect x="150" y="165" width="680" height="18" rx="9" class="track"/>
  <rect x="150" y="165" width="0" height="18" rx="9" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="571" dur="1.6s" fill="freeze" begin="0.5s"/>
  </rect>
  <text x="845" y="180" text-anchor="end" class="pct">84%</text>

  <!-- TypeScript -->
  <text x="30" y="225" class="lbl">TypeScript</text>
  <rect x="150" y="210" width="680" height="18" rx="9" class="track"/>
  <rect x="150" y="210" width="0" height="18" rx="9" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="510" dur="1.6s" fill="freeze" begin="0.7s"/>
  </rect>
  <text x="845" y="225" text-anchor="end" class="pct">75%</text>

  <!-- HTML/CSS -->
  <text x="30" y="270" class="lbl">HTML / CSS</text>
  <rect x="150" y="255" width="680" height="18" rx="9" class="track"/>
  <rect x="150" y="255" width="0" height="18" rx="9" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="652" dur="1.6s" fill="freeze" begin="0.9s"/>
  </rect>
  <text x="845" y="270" text-anchor="end" class="pct">96%</text>

  <!-- Node.js -->
  <text x="30" y="315" class="lbl">Node.js</text>
  <rect x="150" y="300" width="680" height="18" rx="9" class="track"/>
  <rect x="150" y="300" width="0" height="18" rx="9" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="537" dur="1.6s" fill="freeze" begin="1.1s"/>
  </rect>
  <text x="845" y="315" text-anchor="end" class="pct">79%</text>

  <!-- MySQL -->
  <text x="30" y="360" class="lbl">MySQL / PostgreSQL</text>
  <rect x="150" y="345" width="680" height="18" rx="9" class="track"/>
  <rect x="150" y="345" width="0" height="18" rx="9" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="558" dur="1.6s" fill="freeze" begin="1.3s"/>
  </rect>
  <text x="845" y="360" text-anchor="end" class="pct">82%</text>

  <!-- AWS/Cloud -->
  <text x="30" y="405" class="lbl">AWS / Cloud &amp; DevOps</text>
  <rect x="150" y="390" width="680" height="18" rx="9" class="track"/>
  <rect x="150" y="390" width="0" height="18" rx="9" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="482" dur="1.6s" fill="freeze" begin="1.5s"/>
  </rect>
  <text x="845" y="405" text-anchor="end" class="pct">71%</text>
</svg>
