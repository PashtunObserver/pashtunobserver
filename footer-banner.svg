<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#6a11cb;#0f0c29;#302b63" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#2575fc;#302b63;#0f0c29" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="footText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff">
        <animate attributeName="stop-color" values="#00f7ff;#ffd60a;#ff4b6e;#00f7ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff4b6e">
        <animate attributeName="stop-color" values="#ff4b6e;#00f7ff;#ffd60a;#ff4b6e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1000" height="150" fill="url(#footBg)"/>

  <path d="M0,90 C150,130 350,50 500,90 C650,130 850,50 1000,90 L1000,150 L0,150 Z" fill="#ffffff" opacity="0.05">
    <animate attributeName="d"
      values="M0,90 C150,130 350,50 500,90 C650,130 850,50 1000,90 L1000,150 L0,150 Z;
               M0,80 C150,50 350,130 500,80 C650,50 850,130 1000,80 L1000,150 L0,150 Z;
               M0,90 C150,130 350,50 500,90 C650,130 850,50 1000,90 L1000,150 L0,150 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <text x="500" y="55" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="url(#footText)">
    ⭐ Thanks for visiting — star a repo if you liked it! ⭐
  </text>

  <circle cx="60" cy="40" r="6" fill="#ffd60a" opacity="0.7">
    <animate attributeName="cy" values="40;20;40" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="940" cy="40" r="6" fill="#00f7ff" opacity="0.7">
    <animate attributeName="cy" values="40;20;40" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
